name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tests and metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils

      - name: Install Python tools
        run: pip install -r requirements-dev.txt

      - name: REUSE lint
        run: reuse lint

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Desktop file validation
        run: desktop-file-validate data/io.github.octaviobernal.KlipperQR.desktop

      - name: AppStream validation
        run: appstreamcli validate --no-net data/io.github.octaviobernal.KlipperQR.metainfo.xml

  flatpak:
    name: Flatpak build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('flatpak/*.yaml') }}
          restore-keys: flatpak-builder-

      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub build-dir \
            flatpak/io.github.octaviobernal.KlipperQR.yaml
