name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tests and metadata
    # Ubuntu 24.04 (the runner image) has no Qt 6 Kirigami package: it only
    # ships the Qt 5 one. Ubuntu 26.04 has KDE Frameworks 6, and its PySide6
    # (apt) matches its Qt, so the checks run inside an ubuntu:26.04 container.
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates python3 python3-venv python3-pytest python3-segno \
            python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtqml \
            python3-pyside6.qtquick python3-pyside6.qtquickcontrols2 \
            python3-pyside6.qtwidgets python3-pyside6.qtsvg pyside6-tools \
            qml6-module-org-kde-kirigami qml6-module-qtcore \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            kf6-breeze-icon-theme reuse appstream desktop-file-utils \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: actions/checkout@v4

      # The container user differs from the checkout owner; reuse calls git.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # PySide6 comes from apt (same Qt as the Kirigami QML module); pip must
      # not replace it with a wheel that bundles a different Qt. The venv sees
      # the apt packages and only adds ruff.
      - name: Install Python tools
        run: |
          python3 -m venv --system-site-packages "$HOME/venv"
          "$HOME/venv/bin/pip" install "ruff>=0.5"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: REUSE lint
        run: reuse lint

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        run: pytest

      - name: Translation catalogs are up to date
        run: python3 scripts/check-translations.py

      - name: Desktop file validation
        run: desktop-file-validate data/io.github.octaviobernal.KlipperQR.desktop

      - name: AppStream validation
        run: appstreamcli validate --no-net data/io.github.octaviobernal.KlipperQR.metainfo.xml

  flatpak:
    name: Flatpak build
    runs-on: ubuntu-24.04
    # The Ubuntu 24.04 flatpak-builder/appstream are too old for `appstreamcli
    # compose` to process our metainfo (E: file-read-error). Flathub's
    # container image ships a current toolchain. --privileged is needed for
    # flatpak's sandbox inside the container.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.octaviobernal.KlipperQR.yaml
          build-bundle: "false"
          upload-artifact: "false"
          cache-key: flatpak-builder-${{ hashFiles('flatpak/*.yaml') }}
