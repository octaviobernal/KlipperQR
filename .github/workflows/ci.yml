name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tests and metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils

      # PySide6 wheels link against system GL/EGL/xkbcommon/fontconfig/dbus,
      # which the bare runner image lacks. Needed to import QtGui/QtQml.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0t64

      - name: Install Python tools
        run: pip install -r requirements-dev.txt

      - name: REUSE lint
        run: reuse lint

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Translation catalogs are up to date
        run: python3 scripts/check-translations.py

      - name: Desktop file validation
        run: desktop-file-validate data/io.github.octaviobernal.KlipperQR.desktop

      - name: AppStream validation
        run: appstreamcli validate --no-net data/io.github.octaviobernal.KlipperQR.metainfo.xml

  flatpak:
    name: Flatpak build
    runs-on: ubuntu-24.04
    # The Ubuntu 24.04 flatpak-builder/appstream are too old for `appstreamcli
    # compose` to process our metainfo (E: file-read-error). Flathub's
    # container image ships a current toolchain. --privileged is needed for
    # flatpak's sandbox inside the container.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.octaviobernal.KlipperQR.yaml
          build-bundle: "false"
          upload-artifact: "false"
          cache-key: flatpak-builder-${{ hashFiles('flatpak/*.yaml') }}
